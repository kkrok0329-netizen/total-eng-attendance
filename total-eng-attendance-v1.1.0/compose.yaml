services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /app/data/attendance.sqlite
      TRUST_PROXY: "true"
    volumes:
      - attendance-data:/app/data
      - attendance-backups:/app/backups
    expose: ["3000"]
    read_only: true
    tmpfs: /tmp
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  attendance-data:
  attendance-backups:
  caddy-data:
  caddy-config:
